name: Angular CI/CD

on:
  push:
    branches:
      - feature/feature1

permissions:
  contents: write

defaults:
  run:
    working-directory: Application

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        run: npm run build -- --base-href=/feature1/

      - name: Check build output
        run: |
          echo "Current directory:"
          pwd
          echo "Dist contents:"
          find dist -maxdepth 5 -type f

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Application/dist/application/browser 