name: Angular CI/CD

on:
  push:
    branches:
      - feature/feature1

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: Application
        run: npm install

      - name: Build Angular
        working-directory: Application
        run: npm run build -- --base-href=/feature1/

      - name: Find Angular output
        id: find-output
        run: |
          OUTPUT=$(find Application/dist -type f -name "index.html" -printf '%h\n' | head -n 1)
          echo "Angular output folder: $OUTPUT"
          echo "output=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.find-output.outputs.output }}